track: orientation
track_title: Orientation
module: installing-apps
title: Installing apps
order: 3
steps:
  - id: contrast-installers
    kind: contrast
    title: Repositories, not random .exe files
    body: |
      On Windows you often download installers from websites. On GNOME, **Software**
      installs vetted apps from your distro and Flatpak remotes — similar to an app
      store, with updates in one place.

  - id: gui-software
    kind: gui
    title: Browse GNOME Software
    target_app: org.gnome.Software
    instruction: Open **Software** and browse or search for an app (you do not need to install anything).
    phases:
      - instruction: Open Software from the app grid or search.
        label: Launch GNOME Software
      - instruction: Use the search box or categories to browse available apps.
        label: Browse or search for an app
    hints:
      - Press Super and type "Software".
      - Updates appear in Software as well as installed apps.

  - id: terminal-software-search
    kind: terminal
    title: Search for an app from the terminal
    fixture: fixtures/open-files/
    instruction: |
      Search for a package from the terminal — the same catalogs Software uses.
    distro_variants:
      debian:
        instruction: Run `apt search firefox` to search packages (read-only).
        validate:
          pattern: '^apt\s+search\s+firefox\s*$'
          expect_exit: 0
      fedora:
        instruction: Run `dnf search firefox` to search packages (read-only).
        validate:
          pattern: '^dnf\s+search\s+firefox\s*$'
          expect_exit: 0
      arch:
        instruction: Run `pacman -Ss firefox` to search packages (read-only).
        validate:
          pattern: '^pacman\s+-Ss\s+firefox\s*$'
          expect_exit: 0
      default:
        instruction: Run `apt search firefox` to search packages (read-only).
        validate:
          pattern: '^apt\s+search\s+firefox\s*$'
          expect_exit: 0
    hints:
      - Searching does not install anything.
      - Once you know the package name, terminal installs are faster.

  - id: bridge-software
    kind: bridge
    title: GUI vs terminal installs
    body: |
      Software is ideal when you are exploring. Terminal package managers (`apt`,
      `dnf`, `pacman`) are faster once you know the package name — you will practice
      those in the Software track later.
