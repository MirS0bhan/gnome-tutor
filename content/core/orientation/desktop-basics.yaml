track: orientation
track_title: Orientation
module: desktop-basics
title: What is a Linux desktop?
module_description: Before the terminal, before files — let's get comfortable with the Linux desktop itself. Two minutes.
order: 1
steps:
  - id: contrast-desktop
    kind: contrast
    title: Finding your way around
    body_left: |
      A taskbar along the bottom. A Start menu in the corner. Open windows show as
      buttons you click to switch between.
    body_right: |
      No taskbar, no Start menu. Move your mouse to the top-left corner — or press
      the **Super** key — to open the Activities overview, where everything lives.
    body: |
      Linux desktops use Activities instead of a single taskbar and Start menu.

  - id: tour-activities
    kind: tour
    title: Try it now
    instruction: Move your mouse to the top-left corner of your screen.
    phases:
      - instruction: Move the pointer to the top-left corner or press **Super** to open Activities.
        label: Activities corner
        spotlight:
          - anchor: activities-hotcorner
            label: Activities corner
      - instruction: Click the **app grid** icon to browse installed apps.
        label: Open the app grid
        spotlight:
          - anchor: activities-app-grid
            label: App grid
    hints:
      - Press Super if the hot corner does not respond.
      - Spotlight coordinates vary by screen size — text instructions always work.

  - id: bridge-desktop
    kind: bridge
    title: You're oriented
    body: |
      That's really it — no taskbar to relearn, just one corner (or the Super key)
      that does the job of both the taskbar and the Start menu. Everything else in
      Linux builds on top of this same "go find it" instinct.
    cta_label: Next: Files & the Filesystem →
