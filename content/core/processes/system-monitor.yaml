track: processes
track_title: Processes and monitoring
module: system-monitor
title: System Monitor
order: 1
steps:
  - id: contrast-processes
    kind: contrast
    title: Task Manager equivalents
    body_left: |
      **Task Manager** via Ctrl+Alt+Del on Windows.
    body_right: |
      **System Monitor** on GNOME, or `ps` / `top` / `kill` in a terminal — same
      idea, and scriptable over SSH.
    body: |
      Windows Task Manager and GNOME System Monitor show running apps and resource
      usage. The terminal exposes the same data for remote use.

  - id: gui-monitor
    kind: gui
    title: Find the practice process
    target_app: org.gnome.SystemMonitor
    spawn_process: true
    instruction: |
      Open System Monitor and find **academy-dummy-process** in the process list,
      then end it.
    phases:
      - instruction: Launch **System Monitor** and open the **Processes** tab.
        label: Open System Monitor
      - instruction: Find **academy-dummy-process** and end/stop it.
        label: End the practice process
    hints:
      - Press Super and type System Monitor.
      - Use the search box in the process list if available.

  - id: terminal-kill
    kind: terminal
    title: Stop the process from the terminal
    fixture: fixtures/open-files/
    spawn_process: true
    instruction: |
      Find and stop **academy-dummy-process** with `pkill -f academy-dummy-process`.
    validate:
      pattern: '^pkill\s+(-f\s+)?academy-dummy-process\s*$|^kill\s+\d+\s*$'
      expect_exit: 0
    hints:
      - pgrep academy-dummy-process lists matching PIDs.
      - pkill -f academy-dummy-process stops it by name.

  - id: bridge-processes
    kind: bridge
    title: GUI vs ps/top
    body: |
      System Monitor is enough on your laptop. On a remote server without a GUI,
      `ps`, `top`, and `kill` are how you see and stop runaway processes.
