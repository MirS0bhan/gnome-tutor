track: filesystem
track_title: Files and the filesystem
module: deleting-files
title: Deleting files safely
order: 6
steps:
  - id: contrast-delete
    kind: contrast
    title: Trash vs rm
    body_left: |
      Delete in File Explorer often sends files to **Recycle Bin** first.
    body_right: |
      Files moves items to **Trash**. Terminal **rm** deletes immediately — there
      is no undo. This asymmetry matters in real life.
    body: |
      Files often go to Trash first in the GUI. rm in the terminal deletes
      immediately. That is why we practice in a sandbox folder.

  - id: gui-delete
    kind: gui
    title: Move to Trash
    target_app: org.gnome.Nautilus
    fixture: fixtures/delete-basic/
    instruction: Delete **temp.txt** using Move to Trash (or Delete).
    phases:
      - instruction: Select **temp.txt** in the practice folder.
        label: Select temp.txt
      - instruction: Press **Delete** or right-click → Move to Trash.
        label: Move the file to Trash
    hints:
      - Delete key often moves to Trash on GNOME.
      - Shift+Delete may bypass Trash — avoid that in this lesson.

  - id: terminal-delete
    kind: terminal
    title: rm in the sandbox
    fixture: fixtures/delete-basic/
    instruction: Remove **temp.txt** with `rm temp.txt`.
    validate:
      pattern: '^rm\s+temp\.txt\s*$'
      expect_exit: 0
    hints:
      - rm deletes files permanently in the terminal.
      - rm temp.txt

  - id: bridge-delete
    kind: bridge
    title: rm has no undo
    body: |
      Use Files when you want Trash as a safety net. Use rm when you are certain —
      and never run `rm -rf` on paths you have not double-checked. The GUI and
      terminal are not symmetric here: Trash vs permanent delete.
