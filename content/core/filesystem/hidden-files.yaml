track: filesystem
track_title: Files and the filesystem
module: hidden-files
title: Hidden files
order: 5
steps:
  - id: contrast-hidden
    kind: contrast
    title: Dotfiles are hidden by default
    body_left: |
      Windows hides some system files; you toggle "Show hidden items" in View.
    body_right: |
      Linux config often lives in **dotfiles** (names starting with `.`). Press
      **Ctrl+H** in Files or use `ls -a` in the terminal.
    body: |
      Hidden files on Linux often start with a dot. Both Files and the terminal
      can reveal them.

  - id: gui-hidden
    kind: gui
    title: Show hidden files in Files
    target_app: org.gnome.Nautilus
    fixture: fixtures/hidden-files/
    instruction: Press **Ctrl+H** in Files to reveal hidden files in the practice folder.
    phases:
      - instruction: Open the practice folder and press **Ctrl+H** to toggle hidden files.
        label: Toggle hidden files with Ctrl+H
    hints:
      - Hidden files start with a dot, like .secrets
      - Ctrl+H toggles visibility in Files.

  - id: terminal-hidden
    kind: terminal
    title: ls -a
    fixture: fixtures/hidden-files/
    instruction: List all files including hidden ones with `ls -a`.
    validate:
      pattern: '^ls\s+-a\s*$'
      expect_exit: 0
    hints:
      - ls lists directory contents.
      - The -a flag shows hidden dotfiles.

  - id: bridge-hidden
    kind: bridge
    title: Ctrl+H vs ls -a
    body: |
      Ctrl+H in Files and ls -a in the terminal show the same dotfiles. Config
      folders like .config are why backing up ~/.config copies much of your setup.
