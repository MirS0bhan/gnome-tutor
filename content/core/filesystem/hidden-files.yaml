track: filesystem
track_title: Files and the filesystem
module: hidden-files
title: Hidden files
order: 5
steps:
  - id: contrast-hidden
    kind: contrast
    title: Dotfiles
    body: |
      Files and folders whose names start with a dot (`.`) are **hidden** by default.
      They often hold app settings — for example `.config` in your home folder.

  - id: gui-hidden
    kind: gui
    title: Show hidden files
    target_app: org.gnome.Nautilus
    fixture: fixtures/hidden-files/
    instruction: Show hidden files and find **.secrets** in the practice folder.
    phases:
      - instruction: Press **Ctrl+H** (or the menu ☰ → Show Hidden Files).
        label: Toggle hidden files with Ctrl+H
      - instruction: Look for the hidden file **.secrets** in the list.
        label: Find .secrets in the folder
    hints:
      - Hidden files start with a dot.
      - Ctrl+H toggles hidden files in Nautilus.

  - id: terminal-hidden
    kind: terminal
    title: ls -a
    fixture: fixtures/hidden-files/
    instruction: List all files including hidden ones with `ls -a`.
    validate:
      pattern: '^ls\s+-a\s*$'
      expect_exit: 0
    hints:
      - ls lists files; -a means "all", including dotfiles.
      - ls -a

  - id: bridge-hidden
    kind: bridge
    title: Seeing hidden files
    body: |
      The GUI toggle is perfect when exploring. `ls -a` is faster when you already
      know you need dotfiles in a script or remote session.
