track: filesystem
track_title: فایل‌ها و سیستم فایل
module: opening-files
title: باز کردن فایل‌ها (Nautilus)
order: 1
steps:
  - id: contrast-nautilus
    kind: contrast
    title: برنامه فایل‌ها در برابر File Explorer
    body_left: |
      **File Explorer** با حرف درایو (C:\، D:\) و بک‌اسلش.
    body_right: |
      **فایل‌ها** (Nautilus) زیر یک پوشه **Home**. اسلش رو به جلو.
      نام فایل به حروف بزرگ/کوچک حساس است: Photo.jpg ≠ photo.jpg.
    body: |
      در ویندوز File Explorer دارید. در GNOME **فایل‌ها** (Nautilus) پوشه home،
      میانبرهای نوار کناری و محتوای هر پوشه را نشان می‌دهد. حرف درایو وجود ندارد.

  - id: gui-open-nautilus
    kind: gui
    title: مرور پوشه‌ها در فایل‌ها
    target_app: org.gnome.Nautilus
    fixture: fixtures/open-files/
    instruction: |
      فایل‌ها را روی پوشه تمرین باز کنید. با نوار کناری به Documents و Downloads بروید.
    phases:
      - instruction: روی **Documents** در نوار کناری کلیک کنید.
        label: Documents را در نوار کناری باز کنید
        spotlight:
          - anchor: nautilus-sidebar
            label: Documents در نوار کناری
      - instruction: **Downloads** را باز کنید و فایل‌ها را ببینید.
        label: Downloads را از نوار کناری باز کنید
        spotlight:
          - anchor: nautilus-sidebar
            label: Downloads در نوار کناری
    hints:
      - Super را بزنید و «Files» یا «فایل‌ها» را تایپ کنید.
      - از نوار کناری بین Documents و Downloads جابه‌جا شوید.
      - دوبار کلیک روی پوشه یا از میانبرهای کناری استفاده کنید.

  - id: terminal-navigate
    kind: terminal
    title: cd به Documents
    fixture: fixtures/open-files/
    instruction: |
      در ترمینال با `cd Documents` وارد پوشه Documents شوید.
    validate:
      pattern: '^cd\s+Documents/?\s*$'
      expect_exit: 0
    hints:
      - cd یعنی change directory (تغییر پوشه).
      - از cd Documents شروع کنید — پوشه sandbox نقطه شروع شماست.
      - بعد از cd Documents، ls را برای فهرست فایل‌ها اجرا کنید.

  - id: bridge-navigation
    kind: bridge
    title: رابط گرافیکی و ترمینال با هم
    body: |
      همان پوشه‌ها را دو بار مرور کردید. برنامه فایل‌ها برای اکتشاف بصری عالی است.
      ترمینال وقتی مسیر را می‌دانید یا باید سریع با cd و ls جابه‌جا شوید بهتر است.
