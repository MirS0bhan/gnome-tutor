track: filesystem
track_title: فایل‌ها و سیستم فایل
module: hidden-files
title: فایل‌های مخفی
order: 5
steps:
  - id: contrast-hidden
    kind: contrast
    title: dotfileها به‌طور پیش‌فرض مخفی‌اند
    body_left: |
      ویندوز بعضی فایل سیستم را مخفی می‌کند؛ در View «نمایش موارد مخفی» را روشن می‌کنید.
    body_right: |
      تنظیمات لینوکس اغلب در **dotfile** (نام با `.`) است. **Ctrl+H** در فایل‌ها
      یا `ls -a` در ترمینال.
    body: |
      فایل مخفی لینوکس اغلب با نقطه شروع می‌شود. فایل‌ها و ترمینال هر دو می‌توانند نشان دهند.

  - id: gui-hidden
    kind: gui
    title: نمایش فایل مخفی در فایل‌ها
    target_app: org.gnome.Nautilus
    fixture: fixtures/hidden-files/
    instruction: **Ctrl+H** را در فایل‌ها بزنید تا فایل‌های مخفی پوشه تمرین دیده شوند.
    phases:
      - instruction: پوشه تمرین را باز و **Ctrl+H** برای نمایش/پنهان کردن فایل مخفی.
        label: Ctrl+H برای فایل مخفی
    hints:
      - فایل مخفی با نقطه شروع می‌شود، مثل .secrets
      - Ctrl+H در فایل‌ها visibility را عوض می‌کند.

  - id: terminal-hidden
    kind: terminal
    title: ls -a
    fixture: fixtures/hidden-files/
    instruction: با `ls -a` همه فایل‌ها از جمله مخفی را فهرست کنید.
    validate:
      pattern: '^ls\s+-a\s*$'
      expect_exit: 0
    hints:
      - ls محتوای پوشه را نشان می‌دهد.
      - پرچم -a dotfileها را هم نشان می‌دهد.

  - id: bridge-hidden
    kind: bridge
    title: Ctrl+H در برابر ls -a
    body: |
      Ctrl+H در فایل‌ها و ls -a در ترمینال همان dotfileها را نشان می‌دهند. پوشه‌هایی
      مثل .config دلیلش این است که پشتیبان ~/.config بخش زیادی از تنظیمات را کپی می‌کند.
