track: orientation
track_title: آشنایی
module: desktop-basics
title: میزکار لینوکس چیست؟
module_description: پیش از ترمینال و پیش از فایل‌ها — با میزکار لینوکس آشنا شوید. حدود دو دقیقه.
order: 1
steps:
  - id: contrast-desktop
    kind: contrast
    title: پیدا کردن مسیر در میزکار
    body_left: |
      نوار وظیفه در پایین. منوی استارت در گوشه. پنجره‌های باز به‌صورت دکمه‌ای
      برای جابه‌جایی نمایش داده می‌شوند.
    body_right: |
      بدون نوار وظیفه، بدون منوی استارت. ماوس را به گوشه بالا-چپ ببرید — یا
      کلید **Super** را بزنید — تا نمای کلی فعالیت‌ها باز شود؛ همه‌چیز آنجاست.
    body: |
      میزکار لینوکس به‌جای نوار وظیفه و منوی استارت از «فعالیت‌ها» استفاده می‌کند.

  - id: tour-activities
    kind: tour
    title: همین حالا امتحان کنید
    instruction: ماوس را به گوشه بالا-چپ صفحه ببرید.
    phases:
      - instruction: نشانگر را به گوشه بالا-چپ ببرید یا **Super** را بزنید تا فعالیت‌ها باز شود.
        label: گوشه فعالیت‌ها
        spotlight:
          - anchor: activities-hotcorner
            label: گوشه فعالیت‌ها
      - instruction: روی آیکون **شبکه برنامه‌ها** کلیک کنید تا برنامه‌های نصب‌شده را ببینید.
        label: باز کردن شبکه برنامه‌ها
        spotlight:
          - anchor: activities-app-grid
            label: شبکه برنامه‌ها
    hints:
      - اگر گوشه داغ کار نکرد Super را بزنید.
      - مختصات Spotlight با اندازه صفحه فرق می‌کند — دستورالعمل متنی همیشه کار می‌کند.

  - id: bridge-desktop
    kind: bridge
    title: آماده‌اید
    body: |
      همین است — نوار وظیفه‌ای برای یادگیری مجدد نیست؛ یک گوشه (یا Super) کار
      نوار وظیفه و منوی استارت را با هم انجام می‌دهد. بقیه لینوکس روی همین
      «برو پیدا کن» بنا شده است.
    cta_label: بعدی: فایل‌ها و سیستم فایل ←
